name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (JVM) e Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e compilação Android
        run: ./gradlew :bonifiq-core:jvmTest :bonifiq-ui:jvmTest :bonifiq-ui:compileAndroidMain --stacktrace

  ios:
    name: Framework iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Liga o framework de verdade (o Windows/Linux só compila os klibs): pega erro de link e de API do iOS.
      - name: Link do framework para o simulador
        run: ./gradlew :bonifiq-ui:linkDebugFrameworkIosSimulatorArm64 --stacktrace
