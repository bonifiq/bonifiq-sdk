# Release pública do SDK: Maven Central (Android, JVM, iOS klibs) + XCFramework para o Swift Package Manager.
# Rodar em Actions → Release → Run workflow, informando a versão que já está no libs.versions.toml.
# Depois do upload, a versão fica aguardando o "Publish" em central.sonatype.com → Deployments.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (igual ao bonifiq-sdk do libs.versions.toml, ex.: 0.3.0)"
        required: true
      publish_maven:
        description: "Enviar ao Maven Central. Desmarque para refazer só XCFrameworks, tag e Release quando o Central já recebeu esta versão."
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Um único host (macOS) publica todos os alvos: o Central recusa a mesma versão enviada de duas máquinas,
    # e o XCFramework só é gerado no macOS.
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a versão
        run: |
          set -euo pipefail
          grep -q "^bonifiq-sdk = \"$VERSION\"$" gradle/libs.versions.toml \
            || { echo "gradle/libs.versions.toml não está em $VERSION"; exit 1; }
          grep -q "VERSION: String = \"$VERSION\"" bonifiq-core/src/commonMain/kotlin/br/com/bonifiq/sdk/BonifiQ.kt \
            || { echo "BonifiQ.VERSION não está em $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "A tag $VERSION já existe"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew :bonifiq-core:jvmTest :bonifiq-ui:jvmTest :bonifiq-fitness:jvmTest :bonifiq-push:jvmTest --stacktrace

      - name: Publicar no Maven Central (aguarda o "Publish" no portal)
        if: inputs.publish_maven
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

      # Dois frameworks: BonifiQ (core + UI + push) e BonifiQFitness (o mesmo + Fitness/HealthKit). O app usa um dos dois.
      # Um link por vez: os quatro links em modo release (2 frameworks x 2 alvos) em paralelo estouram a memória do Gradle.
      - name: Gerar os XCFrameworks
        run: |
          set -euo pipefail
          ./gradlew :bonifiq-ios:assembleBonifiQReleaseXCFramework --max-workers=1 --stacktrace
          ./gradlew :bonifiq-ios-fitness:assembleBonifiQFitnessReleaseXCFramework --max-workers=1 --stacktrace
          (cd bonifiq-ios/build/XCFrameworks/release &&
            ditto -c -k --sequesterRsrc --keepParent BonifiQ.xcframework "$GITHUB_WORKSPACE/BonifiQ.xcframework.zip")
          (cd bonifiq-ios-fitness/build/XCFrameworks/release &&
            ditto -c -k --sequesterRsrc --keepParent BonifiQFitness.xcframework "$GITHUB_WORKSPACE/BonifiQFitness.xcframework.zip")

      - name: Atualizar o Package.swift, commitar e criar a tag
        run: |
          set -euo pipefail
          CHECKSUM=$(swift package compute-checksum BonifiQ.xcframework.zip)
          FITNESS_CHECKSUM=$(swift package compute-checksum BonifiQFitness.xcframework.zip)
          sed -i '' -E \
            -e "s#^let version = \"[^\"]*\"#let version = \"$VERSION\"#" \
            -e "s#^let bonifiqChecksum = \"[^\"]*\"#let bonifiqChecksum = \"$CHECKSUM\"#" \
            -e "s#^let bonifiqFitnessChecksum = \"[^\"]*\"#let bonifiqFitnessChecksum = \"$FITNESS_CHECKSUM\"#" \
            Package.swift
          grep -q "^let bonifiqFitnessChecksum = \"$FITNESS_CHECKSUM\"" Package.swift || { echo "Package.swift não foi atualizado"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

      - name: Release no GitHub com os XCFrameworks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" BonifiQ.xcframework.zip BonifiQFitness.xcframework.zip --title "$VERSION" --generate-notes
